[build-system]
requires = ["setuptools>=61.0", "wheel", "build"]
build-backend = "setuptools.build_meta"

[project]
name = "ralign"
version = "0.1.0"
description = "Utilities to generate synthetic tabular samples and compute model alignment (Rashomon alignment)."
readme = "README.md"
license = { text = "MIT" }
authors = [ { name = "Moises Santos", email = "moises0rocha@gmail.com" } ]
requires-python = ">=3.8"
keywords = [
  "machine learning",
  "model comparison",
  "rashomon alignment",
  "decision boundaries",
  "interpretability",
  "model agreement",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
  "numpy>=1.23",
  "pandas>=1.5",
  "scipy>=1.9",
  "scikit-learn>=1.2",
  "matplotlib>=3.5",
  "umap-learn>=0.5.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "build",
  "twine",
]

[project.urls]
Homepage = "https://github.com/mmrsantos/ralign"
Repository = "https://github.com/mmrsantos/ralign"
Issues = "https://github.com/mmrsantos/ralign/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["ralign*"]
