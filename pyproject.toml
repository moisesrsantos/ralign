[build-system]
requires = ["setuptools>=61.0", "wheel", "build"]
build-backend = "setuptools.build_meta"

[project]
name = "pyRA"
version = "0.1.0"
description = "Utilities to generate synthetic tabular samples and compute model alignment (Rashomon alignment)."
readme = "README.md"
license = { text = "MIT" }
authors = [ { name = "Moises Santos", email = "moises0rocha@gmail.com" } ]
requires-python = ">=3.8"
dependencies = [
  "numpy>=1.23",
  "pandas>=1.5",
  "scikit-learn>=1.2",
  "matplotlib>=3.5",
  "umap-learn>=0.5.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pyRA"]
